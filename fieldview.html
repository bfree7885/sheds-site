







<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sheds Field View</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
font-family:sans-serif;
}

#map{
position:absolute;
top:0;
bottom:0;
width:100%;
}

#panel{
position:absolute;
top:10px;
left:10px;
background:white;
padding:12px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.3);
font-size:14px;
z-index:1;
width:200px;
}

button{
width:100%;
margin-top:6px;
padding:7px;
border:none;
background:#2d6cdf;
color:white;
border-radius:5px;
cursor:pointer;
}

button.secondary{
background:#666;
}

.layer{
margin-top:8px;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="panel">

<h3>Sheds</h3>

<button id="locateButton">Find My Terrain</button>

<button id="startTrack">Start Track</button>

<button id="stopTrack" class="secondary">Stop Track</button>

<button id="addObservation">Add Observation</button>

<button id="loadTracks">Load Saved Hikes</button>

<div class="layer">
<label>
<input type="checkbox" id="hillshadeToggle">
 Terrain Shading
</label>
</div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken='pk.eyJ1IjoiYmZyZWU3ODg1IiwiYSI6ImNtbWU0ajk3YjA5d2kycnB2a296ZjlxbnQifQ.mwFGViXSEvoP-h7I2kvw4Q';

const map=new mapboxgl.Map({
container:'map',
style:'mapbox://styles/mapbox/outdoors-v12',
center:[-98,39],
zoom:3
});

map.addControl(new mapboxgl.NavigationControl());

/* TERRAIN SOURCE */

map.on('load',()=>{

map.addSource('terrain',{
type:'raster-dem',
url:'mapbox://mapbox.terrain-rgb',
tileSize:512,
maxzoom:14
});

map.setTerrain({
source:'terrain',
exaggeration:1.2
});

/* BETTER HILLSHADE */

map.addLayer({
id:'hillshade',
type:'hillshade',
source:'terrain',
layout:{visibility:'none'},
paint:{
'hillshade-shadow-color':'#1f1f1f',
'hillshade-highlight-color':'#ffffff',
'hillshade-accent-color':'#8fae66'
}
});

});

/* TOGGLE HILLSHADE */

document.getElementById('hillshadeToggle').onchange=function(){

if(this.checked){
map.setLayoutProperty('hillshade','visibility','visible');
}else{
map.setLayoutProperty('hillshade','visibility','none');
}

};

/* USER ARROW MARKER */

let userMarker=null;

/* FIND MY TERRAIN */

document.getElementById('locateButton').onclick=function(){

navigator.geolocation.getCurrentPosition(function(position){

const loc=[position.coords.longitude,position.coords.latitude];

map.flyTo({
center:loc,
zoom:14
});

if(userMarker){userMarker.remove();}

const arrow=document.createElement('div');

arrow.style.width="0";
arrow.style.height="0";
arrow.style.borderLeft="10px solid transparent";
arrow.style.borderRight="10px solid transparent";
arrow.style.borderBottom="20px solid #007AFF";

userMarker=new mapboxgl.Marker(arrow)
.setLngLat(loc)
.addTo(map);

});

};

/* TRACKING */

let tracking=false;
let trackCoords=[];
let trackLayerAdded=false;

/* START TRACK */

document.getElementById('startTrack').onclick=function(){

tracking=true;
trackCoords=[];

alert("Track recording started");

};

/* STOP TRACK */

document.getElementById('stopTrack').onclick=function(){

tracking=false;

const name=prompt("Name this hike:");

if(!name)return;

const saved=JSON.parse(localStorage.getItem("sheds_tracks")||"[]");

saved.push({
name:name,
coords:trackCoords
});

localStorage.setItem("sheds_tracks",JSON.stringify(saved));

alert("Hike saved");

};

/* RECORD TRACK */

navigator.geolocation.watchPosition(function(position){

if(!tracking)return;

const point=[position.coords.longitude,position.coords.latitude];

trackCoords.push(point);

if(!trackLayerAdded){

map.addSource('track',{
type:'geojson',
data:{
type:'Feature',
geometry:{
type:'LineString',
coordinates:trackCoords
}
}
});

map.addLayer({
id:'trackLine',
type:'line',
source:'track',
paint:{
'line-color':'#ff0000',
'line-width':4
}
});

trackLayerAdded=true;

}else{

map.getSource('track').setData({
type:'Feature',
geometry:{
type:'LineString',
coordinates:trackCoords
}
});

}

});

/* TERRAIN ANALYSIS */

function calculateTerrain(lngLat){

const step=0.0001;

const center=map.queryTerrainElevation(lngLat);

const north=map.queryTerrainElevation([
lngLat.lng,
lngLat.lat+step
]);

const east=map.queryTerrainElevation([
lngLat.lng+step,
lngLat.lat
]);

if(center===null||north===null||east===null){
return null;
}

const dzdx=east-center;
const dzdy=north-center;

const slope=Math.sqrt(dzdx*dzdx+dzdy*dzdy);

const aspect=Math.atan2(dzdy,-dzdx)*180/Math.PI;

return{
elevation:center,
slope:Math.abs(slope),
aspect:aspect
};

}

/* OBSERVATIONS */

document.getElementById('addObservation').onclick=function(){

alert("Click map to add observation");

map.once('click',function(e){

const terrain=calculateTerrain(e.lngLat);

console.log(terrain);

new mapboxgl.Marker({color:"#22aa22"})
.setLngLat(e.lngLat)
.setPopup(
new mapboxgl.Popup().setText(
"Elevation: "+Math.round(terrain.elevation)+"m\nSlope: "+terrain.slope.toFixed(2)+"\nAspect: "+terrain.aspect.toFixed(0)+"°"
))
.addTo(map);

});

};

/* LOAD SAVED TRACKS */

document.getElementById('loadTracks').onclick=function(){

const saved=JSON.parse(localStorage.getItem("sheds_tracks")||"[]");

saved.forEach(function(track){

map.addLayer({
id:'track-'+Math.random(),
type:'line',
source:{
type:'geojson',
data:{
type:'Feature',
geometry:{
type:'LineString',
coordinates:track.coords
}
}
},
paint:{
'line-color':'#ff6600',
'line-width':3
}
});

});

};

</script>

</body>
</html>
