name: Auto publish field note

on:
  push:
    paths:
      - publish.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Exit if no publish file
        run: |
          if [ ! -f publish.json ]; then
            exit 0
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract values
        run: |
          TITLE=$(jq -r '.title' publish.json)
          DATE=$(jq -r '.date' publish.json)
          CONTENT=$(jq -r '.content' publish.json)

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

          printf "%s\n" "$CONTENT" > post_content.html

      - name: Ensure feed file exists
        run: |
          mkdir -p briefs
          if [ ! -f briefs/index.html ]; then
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Sheds Field Notes</title><link rel='stylesheet' href='/styles.css'></head><body><div class='container'><h1>Sheds Field Notes</h1><hr></div></body></html>" > briefs/index.html
          fi

      - name: Insert at top of feed
        run: |
          cp briefs/index.html briefs/index_backup.html

          awk '
          /<hr>/ && !x {
            print
            print "<hr>"
            print "<h2>" ENVIRON["TITLE"] "</h2>"
            print "<p><em>" ENVIRON["DATE"] "</em></p>"
            system("cat post_content.html")
            x=1
            next
          }
          { print }
          ' briefs/index_backup.html > briefs/index.html

      - name: Cleanup
        run: rm publish.json post_content.html briefs/index_backup.html

      - name: Commit changes
        run: |
          git config user.name "Sheds Auto Publisher"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto publish: $TITLE" || echo "Nothing to commit"
          git push
