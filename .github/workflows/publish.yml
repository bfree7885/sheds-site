name: Auto publish field note

on:
  push:
    paths:
      - publish.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Exit if publish.json missing
        run: |
          if [ ! -f publish.json ]; then
            echo "No publish.json found. Exiting."
            exit 0
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract fields
        run: |
          TITLE=$(jq -r '.title' publish.json)
          DATE=$(jq -r '.date' publish.json)
          CONTENT=$(jq -r '.content' publish.json)

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

          echo "<hr>" > new_post.html
          echo "<h2>$TITLE</h2>" >> new_post.html
          echo "<p><em>$DATE</em></p>" >> new_post.html
          echo "$CONTENT" >> new_post.html

      - name: Ensure feed file exists
        run: |
          mkdir -p briefs
          if [ ! -f briefs/index.html ]; then
            echo "<!DOCTYPE html>" > briefs/index.html
            echo "<html><head><meta charset='UTF-8'><title>Sheds Field Notes</title><link rel='stylesheet' href='/styles.css'></head>" >> briefs/index.html
            echo "<body><div class='container'><h1>Sheds Field Notes</h1><hr></div></body></html>" >> briefs/index.html
          fi

      - name: Insert post at top
        run: |
          awk '
          /<hr>/ && !done {
              print;
              system("cat new_post.html");
              done=1;
              next
          }
          { print }
          ' briefs/index.html > briefs/tmp.html

          mv briefs/tmp.html briefs/index.html

      - name: Cleanup
        run: rm -f publish.json new_post.html

      - name: Commit changes
        run: |
          git config user.name "Sheds Auto Publisher"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto publish: $TITLE" || echo "Nothing to commit"
          git push
