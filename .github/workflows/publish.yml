name: Sheds Auto Publish

on:
  push:
    paths:
      - "publish.json"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SHEDS_TOKEN }}

      - name: Read publish file
        id: publishdata
        run: |
          CONTENT=$(cat publish.json)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create HTML file
        run: |
          FILENAME=$(jq -r '.filename' publish.json)
          HTML=$(jq -r '.html' publish.json)

          echo "$HTML" > briefs/$FILENAME

      - name: Update index
        run: |
          FILENAME=$(jq -r '.filename' publish.json)
          TITLE=$(jq -r '.title' publish.json)

          echo "<li><a href=\"$FILENAME\">$TITLE</a></li>" >> briefs/index.html

      - name: Remove publish file
        run: rm publish.json

      - name: Commit changes
        run: |
          git config user.name "sheds-bot"
          git config user.email "bot@sheds.local"
          git add .
          git commit -m "Auto publish field note"
          git push
