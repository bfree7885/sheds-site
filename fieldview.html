


<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sheds Field View</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

<style>

body {
  margin:0;
  padding:0;
}

#map {
  position:absolute;
  top:0;
  bottom:0;
  width:100%;
}

/* Layer panel */

#layerPanel {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:12px;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  font-family:sans-serif;
  font-size:14px;
  z-index:1;
}

#layerPanel h3 {
  margin:0 0 8px 0;
  font-size:14px;
}

.layer-item {
  margin-bottom:6px;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="layerPanel">

<h3>Sheds Layers</h3>

<div class="layer-item">
<input type="checkbox" id="terrainLayer" checked>
<label for="terrainLayer">Terrain</label>
</div>

<div class="layer-item">
<input type="checkbox" id="southSlopes">
<label for="southSlopes">South-facing slopes</label>
</div>

<div class="layer-item">
<input type="checkbox" id="benches">
<label for="benches">Ridge benches</label>
</div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiYmZyZWU3ODg1IiwiYSI6ImNtbWU0ajk3YjA5d2kycnB2a296ZjlxbnQifQ.mwFGViXSEvoP-h7I2kvw4Q';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [-98, 39],
  zoom: 3
});

map.addControl(new mapboxgl.NavigationControl());

map.addControl(
  new mapboxgl.GeolocateControl({
    positionOptions: {
      enableHighAccuracy: true
    },
    trackUserLocation: true
  })
);

</script>

</body>
</html>
