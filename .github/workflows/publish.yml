name: Auto publish field note

on:
  push:
    branches:
      - main
    paths:
      - publish.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SHEDS_TOKEN }}

      - name: Publish if file exists
        run: |
          if [ ! -f publish.json ]; then
            echo "No publish.json found. Skipping."
            exit 0
          fi

          SLUG=$(jq -r '.slug' publish.json)
          TITLE=$(jq -r '.title' publish.json)
          CONTENT=$(jq -r '.content' publish.json)

          mkdir -p briefs

          echo "<!DOCTYPE html>" > briefs/$SLUG.html
          echo "<html lang=\"en\">" >> briefs/$SLUG.html
          echo "<head>" >> briefs/$SLUG.html
          echo "  <meta charset=\"UTF-8\" />" >> briefs/$SLUG.html
          echo "  <title>$TITLE</title>" >> briefs/$SLUG.html
          echo "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />" >> briefs/$SLUG.html
          echo "  <link rel=\"stylesheet\" href=\"/styles.css\">" >> briefs/$SLUG.html
          echo "</head>" >> briefs/$SLUG.html
          echo "<body>" >> briefs/$SLUG.html
          echo "  <div class=\"container\">" >> briefs/$SLUG.html
          echo "$CONTENT" >> briefs/$SLUG.html
          echo "  </div>" >> briefs/$SLUG.html
          echo "</body>" >> briefs/$SLUG.html
          echo "</html>" >> briefs/$SLUG.html

          echo "<li><a href=\"$SLUG.html\">$TITLE</a></li>" >> briefs/index.html

          rm publish.json

          git config --global user.name "Sheds Automation"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto publish: $TITLE"
          git push
