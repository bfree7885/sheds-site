name: Auto publish field note

on:
  push:
    branches:
      - main
    paths:
      - publish.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SHEDS_TOKEN }}

      - name: Ensure publish file exists
        run: |
          if [ ! -f publish.json ]; then
            echo "No publish.json found. Skipping."
            exit 0
          fi

      - name: Read publish file
        run: |
          SLUG=$(jq -r '.slug' publish.json)
          TITLE=$(jq -r '.title' publish.json)
          DATE=$(jq -r '.date' publish.json)
          CONTENT=$(jq -r '.content' publish.json)

          FILENAME="$SLUG.html"

          mkdir -p briefs

          cat <<EOF > briefs/$FILENAME
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>$TITLE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    $CONTENT
  </div>
</body>
</html>
EOF

          echo "<li><a href=\"$FILENAME\">$TITLE</a></li>" >> briefs/index.html

      - name: Remove publish file
        run: rm publish.json

      - name: Commit changes
        run: |
          git config --global user.name "Sheds Automation"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto publish: $TITLE"
          git push
