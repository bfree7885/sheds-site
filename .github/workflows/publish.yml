name: Auto publish field note

on:
  push:
    paths:
      - publish.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Stop if publish.json missing
        run: |
          if [ ! -f publish.json ]; then
            echo "No publish.json found. Exiting."
            exit 0
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Extract fields
        run: |
          TITLE=$(jq -r '.title' publish.json)
          DATE=$(jq -r '.date' publish.json)
          CONTENT=$(jq -r '.content' publish.json)

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

          echo "CONTENT<<EOF" >> $GITHUB_ENV
          echo "$CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Prepend post to feed
        run: |
          TMPFILE=$(mktemp)

          cat <<EOF > $TMPFILE
<hr>
<h2>${TITLE}</h2>
<p><em>${DATE}</em></p>
${CONTENT}

EOF

          awk '/<!-- POSTS INSERTED BELOW -->/ {
            print;
            system("cat " "'"$TMPFILE"'");
            next
          }1' briefs/index.html > briefs/index_new.html

          mv briefs/index_new.html briefs/index.html

      - name: Remove publish file
        run: rm publish.json

      - name: Commit changes
        run: |
          git config user.name "Sheds Auto Publisher"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto publish: ${TITLE}" || echo "No changes to commit"
          git push
