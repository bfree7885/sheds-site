




<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sheds Field View</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
}

#map{
position:absolute;
top:0;
bottom:0;
width:100%;
}

#panel{
position:absolute;
top:10px;
left:10px;
background:white;
padding:12px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
font-family:sans-serif;
font-size:14px;
z-index:1;
width:180px;
}

button{
width:100%;
margin-top:5px;
padding:6px;
border:none;
background:#2d6cdf;
color:white;
border-radius:4px;
cursor:pointer;
}

button.secondary{
background:#777;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="panel">

<h3>Sheds</h3>

<button id="locateButton">Find My Terrain</button>

<button id="startTrack">Start Track</button>

<button id="stopTrack" class="secondary">Stop Track</button>

<button id="addObservation">Add Observation</button>

<button id="loadTracks">Load Saved Hikes</button>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken='pk.eyJ1IjoiYmZyZWU3ODg1IiwiYSI6ImNtbWU0ajk3YjA5d2kycnB2a296ZjlxbnQifQ.mwFGViXSEvoP-h7I2kvw4Q';


/* MAP */

const map=new mapboxgl.Map({
container:'map',
style:'mapbox://styles/mapbox/outdoors-v12',
center:[-98,39],
zoom:3
});

/* NAVIGATION CONTROLS */

map.addControl(new mapboxgl.NavigationControl());

map.addControl(new mapboxgl.GeolocateControl({
positionOptions:{enableHighAccuracy:true},
trackUserLocation:true
}));

/* TERRAIN SOURCE */

map.on('load',()=>{

map.addSource('terrain',{
type:'raster-dem',
url:'mapbox://mapbox.terrain-rgb',
tileSize:512,
maxzoom:14
});

map.setTerrain({
source:'terrain',
exaggeration:1.0
});

});

/* USER LOCATION MARKER */

let userMarker=null;

/* TRACK SYSTEM */

let tracking=false;
let trackCoords=[];
let trackLayerAdded=false;

/* FIND MY TERRAIN */

document.getElementById('locateButton').onclick=function(){

navigator.geolocation.getCurrentPosition(function(position){

const loc=[position.coords.longitude,position.coords.latitude];

map.flyTo({center:loc,zoom:13});

if(userMarker){userMarker.remove();}

userMarker=new mapboxgl.Marker({color:"#007AFF"})
.setLngLat(loc)
.addTo(map);

});

};

/* START TRACK */

document.getElementById('startTrack').onclick=function(){

tracking=true;
trackCoords=[];
alert("Track recording started");

};

/* STOP TRACK */

document.getElementById('stopTrack').onclick=function(){

tracking=false;

const name=prompt("Name this hike:");

if(!name) return;

const saved=JSON.parse(localStorage.getItem("sheds_tracks")||"[]");

saved.push({
name:name,
coords:trackCoords
});

localStorage.setItem("sheds_tracks",JSON.stringify(saved));

alert("Hike saved");

};

/* TRACK RECORDING */

navigator.geolocation.watchPosition(function(position){

if(!tracking) return;

const point=[position.coords.longitude,position.coords.latitude];

trackCoords.push(point);

if(!trackLayerAdded){

map.addSource('track',{
type:'geojson',
data:{
type:'Feature',
geometry:{
type:'LineString',
coordinates:trackCoords
}
}
});

map.addLayer({
id:'trackLine',
type:'line',
source:'track',
paint:{
'line-color':'#ff0000',
'line-width':4
}
});

trackLayerAdded=true;

}else{

map.getSource('track').setData({
type:'Feature',
geometry:{
type:'LineString',
coordinates:trackCoords
}
});

}

});

/* OBSERVATIONS WITH TERRAIN DATA */

document.getElementById('addObservation').onclick=function(){

alert("Click map to add observation");

map.once('click',function(e){

const elevation=map.queryTerrainElevation(e.lngLat);

const observation={
type:"observation",
lat:e.lngLat.lat,
lng:e.lngLat.lng,
elevation:elevation,
timestamp:Date.now()
};

console.log(observation);

new mapboxgl.Marker({color:"#22aa22"})
.setLngLat(e.lngLat)
.setPopup(
new mapboxgl.Popup().setText(
"Elevation: "+Math.round(elevation)+" m"
))
.addTo(map);

});

};

/* LOAD SAVED HIKES */

document.getElementById('loadTracks').onclick=function(){

const saved=JSON.parse(localStorage.getItem("sheds_tracks")||"[]");

saved.forEach(function(track){

map.addLayer({
id:'track-'+Math.random(),
type:'line',
source:{
type:'geojson',
data:{
type:'Feature',
geometry:{
type:'LineString',
coordinates:track.coords
}
}
},
paint:{
'line-color':'#ff6600',
'line-width':3
}
});

});

};

</script>

</body>
</html>
